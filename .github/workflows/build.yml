name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, x86]
    steps:
      - uses: actions/checkout@v4

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.arch }}

      - name: Build
        shell: cmd
        run: >
          cl /nologo /EHsc /W4 /Fe:opm_hdcp_force_${{ matrix.arch }}.exe opm_hdcp_force.cpp
          /link dxva2.lib d3d9.lib bcrypt.lib crypt32.lib user32.lib ole32.lib

      - uses: actions/upload-artifact@v4
        with:
          name: opm_hdcp_force_${{ matrix.arch }}
          path: opm_hdcp_force_${{ matrix.arch }}.exe
          if-no-files-found: error
