name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    strategy:
      matrix:
        arch: [x64, x86]
    steps:
      - uses: actions/checkout@v4

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.arch }}

      - name: Build
        shell: cmd
        run: build.bat ${{ matrix.arch }}

      - uses: actions/upload-artifact@v4
        with:
          name: opm_hdcp_force_${{ matrix.arch }}
          path: opm_hdcp_force_${{ matrix.arch }}.exe
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: opm_hdcp_force_*
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" opm_hdcp_force_*.exe \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --notes "検証用・研究目的のツールです。使い方は README を参照してください。"
